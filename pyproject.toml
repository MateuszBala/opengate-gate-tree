[project]
name = "opengate-gate-tree"
version = "0.1.1"
description = "Processing GATE output file trees - extraction, validation, postprocessing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Jakub Bała" }]
dependencies = []
keywords = ["gate", "opengate", "monte-carlo", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/MateuszBala/opengate-gate-tree"
Repository = "https://github.com/MateuszBala/opengate-gate-tree"

[project.scripts]
opengate-gate-tree = "opengate_gate_tree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengate_gate_tree"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "**/*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
# The minimum runtime is still 3.11 — enforced by `requires-python`,
# `tool.ruff.target-version = py311`, and the CI test matrix (3.11-3.14).
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opengate_gate_tree --cov-report=term-missing"

[tool.coverage.report]
# The coverage threshold (>= 80%) will be enabled once the modules are implemented.
# During the package scaffold stage we do not enforce a threshold so validation can pass.
show_missing = true
